<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion Dashboard - HyperTree</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="font-space min-h-screen antialiased">
    <div id="bg-gradient" class="bg-layer"></div>
    <div id="bg-overlay" class="bg-layer"></div>

    <main class="relative z-10 grid min-h-screen place-items-center px-4">
      <section class="w-full max-w-md rounded-3xl border border-white/20 bg-black/35 p-6 shadow-2xl backdrop-blur-xl">
        <h1 class="text-2xl font-bold">Connexion Dashboard</h1>
        <p class="mt-2 text-sm opacity-80">Connecte-toi pour acceder au mode edition de ton Linktree.</p>

        <form id="login-form" class="mt-5 grid gap-3">
          <input id="login-username" class="field" type="text" placeholder="Nom d'utilisateur" required />
          <input id="login-password" class="field" type="password" placeholder="Mot de passe" required />
          <button class="btn-primary rounded-xl px-4 py-2 text-sm font-semibold" type="submit">
            Se connecter
          </button>
        </form>

        <p id="login-error" class="mt-3 hidden rounded-lg bg-red-500/20 px-3 py-2 text-sm text-red-200"></p>

        <div class="mt-4 rounded-xl border border-white/10 bg-black/25 p-3 text-xs opacity-80">
          <p>Identifiants par defaut:</p>
          <p>Utilisateur: <strong>admin</strong></p>
          <p>Mot de passe: <strong>admin123</strong></p>
        </div>

        <a href="index.html" class="mt-4 inline-block text-sm underline opacity-80">Retour page publique</a>
      </section>
    </main>

    <script type="module" src="assets/js/login.js"></script>
  </body>
</html>
